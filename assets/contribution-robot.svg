  <!-- ===================== -->
  <!-- ROBOT -->
  <!-- ===================== -->

  <g>

    <!-- Robot movement -->
    <g>

      <!-- Robot shadow -->
      <ellipse
        cx="30"
        cy="98"
        rx="15"
        ry="3"
        fill="#58a6ff"
        opacity=".18"
        filter="url(#blueGlow)"
      >
        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          rotate="auto"
        >
          <mpath href="#robotPath"/>
        </animateMotion>
      </ellipse>

      <!-- Robot -->

      <g transform="translate(-8 -12)">

        <animateMotion
          dur="8s"
          repeatCount="indefinite"
          rotate="auto"
        >
          <mpath href="#robotPath"/>
        </animateMotion>

        <!-- antenna -->

        <line
          x1="8"
          y1="0"
          x2="8"
          y2="-8"
          stroke="#58a6ff"
          stroke-width="2"
        />

        <circle
          cx="8"
          cy="-10"
          r="3"
          fill="#39d353"
          filter="url(#greenGlow)"
        >
          <animate
            attributeName="r"
            values="2;4;2"
            dur="1s"
            repeatCount="indefinite"
          />
        </circle>

        <!-- left arm -->

        <rect
          x="-5"
          y="13"
          width="6"
          height="13"
          rx="3"
          fill="#58a6ff"
        >
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="15 -2 15;-15 -2 15;15 -2 15"
            dur=".45s"
            repeatCount="indefinite"
          />
        </rect>

        <!-- right arm -->

        <rect
          x="25"
          y="13"
          width="6"
          height="13"
          rx="3"
          fill="#58a6ff"
        >
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="-15 28 15;15 28 15;-15 28 15"
            dur=".45s"
            repeatCount="indefinite"
          />
        </rect>

        <!-- head -->

        <rect
          x="1"
          y="2"
          width="25"
          height="20"
          rx="5"
          fill="#58a6ff"
          filter="url(#blueGlow)"
        />

        <!-- face -->

        <rect
          x="4"
          y="5"
          width="19"
          height="14"
          rx="3"
          fill="#0d1117"
        />

        <!-- eyes -->

        <rect
          x="7"
          y="9"
          width="4"
          height="4"
          rx="1"
          fill="#39d353"
          filter="url(#greenGlow)"
        >
          <animate
            attributeName="height"
            values="4;1;4"
            keyTimes="0;.05;.1"
            dur="4s"
            repeatCount="indefinite"
          />
        </rect>

        <rect
          x="16"
          y="9"
          width="4"
          height="4"
          rx="1"
          fill="#39d353"
          filter="url(#greenGlow)"
        >
          <animate
            attributeName="height"
            values="4;1;4"
            keyTimes="0;.05;.1"
            dur="4s"
            repeatCount="indefinite"
          />
        </rect>

        <!-- mouth -->

        <rect
          x="9"
          y="16"
          width="9"
          height="2"
          rx="1"
          fill="#58a6ff"
        />

        <!-- body -->

        <rect
          x="4"
          y="22"
          width="19"
          height="14"
          rx="4"
          fill="#58a6ff"
        />

        <!-- chest -->

        <rect
          x="8"
          y="25"
          width="11"
          height="6"
          rx="2"
          fill="#0d1117"
        />

        <circle
          cx="11"
          cy="28"
          r="1.5"
          fill="#26a641"
        />

        <circle
          cx="16"
          cy="28"
          r="1.5"
          fill="#39d353"
        />

        <!-- legs -->

        <rect
          x="7"
          y="34"
          width="6"
          height="9"
          rx="2"
          fill="#58a6ff"
        />

        <rect
          x="15"
          y="34"
          width="6"
          height="9"
          rx="2"
          fill="#58a6ff"
        />

        <!-- walking animation -->

        <animateTransform
          attributeName="transform"
          type="translate"
          values="
            -8 -12;
            -8 -14;
            -8 -12;
            -8 -10;
            -8 -12
          "
          dur=".6s"
          repeatCount="indefinite"
        />

      </g>

    </g>

  </g>

  <!-- Energy particles -->

  <g fill="#39d353" filter="url(#greenGlow)">

    <circle cx="100" cy="90" r="2">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="300" cy="105" r="2">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="550" cy="80" r="2">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

  </g>

  <!-- Footer -->

  <text
    x="30"
    y="170"
    fill="#484f58"
    font-family="monospace"
    font-size="9"
  >
    reasoning • retrieval • tools • generation
  </text>

  <text
    x="770"
    y="170"
    fill="#39d353"
    font-family="monospace"
    font-size="9"
  >
    ● ONLINE
  </text>

</svg>