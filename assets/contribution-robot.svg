<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="210"
  viewBox="0 0 900 210"
  role="img"
  aria-label="Animated AI contribution robot"
>
  <defs>

    <!-- Robot glow -->
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green glow -->
    <filter id="greenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Robot movement path -->
    <path
      id="robotPath"
      d="
        M 30 52
        L 130 52
        L 130 72
        L 250 72
        L 250 92
        L 370 92
        L 370 52
        L 490 52
        L 490 72
        L 610 72
        L 610 92
        L 730 92
        L 730 52
        L 850 52
      "
    />

  </defs>

  <!-- Background -->

  <rect
    width="900"
    height="210"
    rx="16"
    fill="#0d1117"
  />

  <!-- Header -->

  <text
    x="30"
    y="25"
    fill="#8b949e"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    AI AGENT ACTIVITY
  </text>

  <circle
    cx="850"
    cy="21"
    r="4"
    fill="#39d353"
    filter="url(#greenGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="1.5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Contribution Grid -->

  <g transform="translate(30 40)">

    <!-- Row 1 -->

